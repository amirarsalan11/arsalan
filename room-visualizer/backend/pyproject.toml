[project]
name = "room-visualizer-backend"
version = "0.1.0"
description = "Room Visualizer SaaS - FastAPI backend (API Gateway layer)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
